name: CI

on:
  push:
    branches: [main, 'm*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shopdesk
          POSTGRES_PASSWORD: shopdesk
          POSTGRES_DB: shopdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shopdesk -d shopdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: development
      SECRET_KEY: ci-secret-key-1234567890-abcdef

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client sqlite3

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
          python -m playwright install --with-deps chromium

      - name: Lint
        run: ruff check .

      - name: Migrations up
        env:
          DATABASE_URL: postgresql+psycopg://shopdesk:shopdesk@localhost:5432/shopdesk
        run: alembic upgrade head

      - name: Migrations down
        env:
          DATABASE_URL: postgresql+psycopg://shopdesk:shopdesk@localhost:5432/shopdesk
        run: alembic downgrade base

      - name: Migrations up again
        env:
          DATABASE_URL: postgresql+psycopg://shopdesk:shopdesk@localhost:5432/shopdesk
        run: alembic upgrade head

      - name: Run tests (SQLite)
        run: pytest -q

      - name: Run tests (Postgres concurrency)
        env:
          DATABASE_URL: postgresql+psycopg://shopdesk:shopdesk@localhost:5432/shopdesk
        run: pytest tests/test_sales.py::test_concurrent_sale_numbers_unique_and_gap_free_on_postgres tests/test_stock.py::test_concurrent_decrement_never_negative_on_postgres -q

      - name: Boot app and curl /health
        env:
          DATABASE_URL: postgresql+psycopg://shopdesk:shopdesk@localhost:5432/shopdesk
        run: |
          (uvicorn app.main:app --host 127.0.0.1 --port 8000 &) && sleep 3
          curl -sS -o /tmp/health.json -w "HTTP %{http_code}\n" http://127.0.0.1:8000/health
          cat /tmp/health.json
